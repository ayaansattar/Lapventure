  <rect x="100" y="38" width="24" height="40" rx="8" fill="#1b1b1b"/><rect x="103" y="44" width="18" height="3" rx="1.5" fill="#3a3a3a"/><rect x="103" y="52" width="18" height="3" rx="1.5" fill="#3a3a3a"/><rect x="103" y="60" width="18" height="3" rx="1.5" fill="#3a3a3a"/><rect x="103" y="68" width="18" height="3" rx="1.5" fill="#3a3a3a"/><rect x="100" y="38" width="24" height="40" rx="8" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="0" y="168" width="30" height="50" rx="8" fill="#1b1b1b"/><rect x="3" y="174" width="24" height="3" rx="1.5" fill="#3a3a3a"/><rect x="3" y="182" width="24" height="3" rx="1.5" fill="#3a3a3a"/><rect x="3" y="190" width="24" height="3" rx="1.5" fill="#3a3a3a"/><rect x="3" y="198" width="24" height="3" rx="1.5" fill="#3a3a3a"/><rect x="0" y="168" width="30" height="50" rx="8" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="98" y="168" width="30" height="50" rx="8" fill="#1b1b1b"/><rect x="101" y="174" width="24" height="3" rx="1.5" fill="#3a3a3a"/><rect x="101" y="182" width="24" height="3" rx="1.5" fill="#3a3a3a"/><rect x="101" y="190" width="24" height="3" rx="1.5" fill="#3a3a3a"/><rect x="101" y="198" width="24" height="3" rx="1.5" fill="#3a3a3a"/><rect x="98" y="168" width="30" height="50" rx="8" fill="none" stroke="#000" stroke-width="2"/>
